# Review the cost in docs/deployment.md before creating this Blueprint.
services:
  - type: web
    name: clinicflow
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeployTrigger: off
    preDeployCommand: python -m alembic upgrade head
    initialDeployHook: python -m app.seed
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinicflow-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: AI_MODE
        value: demo
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
databases:
  - name: clinicflow-db
    databaseName: clinicflow
    user: clinicflow
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []


name: ClinicFlow checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: clinicflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: clinicflow
          POSTGRES_PASSWORD: ciOnlyDatabasePassword
          POSTGRES_DB: clinicflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicflow -d clinicflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://clinicflow:ciOnlyDatabasePassword@127.0.0.1:5432/clinicflow_test
      TEST_DATABASE_URL: postgresql+psycopg://clinicflow:ciOnlyDatabasePassword@127.0.0.1:5432/clinicflow_test
      AI_MODE: demo
      DEMO_PASSWORD: ciOnlyFictionalDemoPassword
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Migrate the test database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Test backend behavior against PostgreSQL
        working-directory: backend
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
      - name: Seed an isolated browser demo
        working-directory: backend
        run: python -m app.seed --reset
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the API
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/clinicflow-api.log 2>&1 &
          echo $! > /tmp/clinicflow-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/clinicflow-api.log
          exit 1
      - name: Browser workflow and UI regression checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify Docker image builds
        run: docker build --tag clinicflow:ci .
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show API diagnostics on failure
        if: failure()
        run: cat /tmp/clinicflow-api.log || true


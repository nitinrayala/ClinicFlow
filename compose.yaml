name: clinicflow
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicflow}
      POSTGRES_DB: ${POSTGRES_DB:-clinicflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    image: clinicflow:local
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinicflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-clinicflow}
      APP_ENV: ${APP_ENV:-development}
      AI_MODE: ${AI_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "8000"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    image: clinicflow:local
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  seed:
    image: clinicflow:local
    build: .
    environment: *app-environment
    command: ["python", "-m", "app.seed"]
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
volumes:
  postgres-data:

